[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-framework-draft"
version = "0.1.0"
description = "Importable interfaces for a small experiment framework"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
training = ["torch", "torchvision", "PyYAML"]

[tool.setuptools.packages.find]
include = ["experiment_framework*"]
